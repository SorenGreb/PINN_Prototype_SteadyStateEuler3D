<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Dashboard</title>
    <script src="lib/vtk.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111827;
            --panel: #1f2937;
            --panel-border: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            margin: 24px 0 12px;
        }

        .control-panel {
            margin: 20px auto;
            padding: 14px 18px;
            width: min(760px, 90%);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: rgba(31, 41, 55, 0.9);
        }

        label {
            font-size: 1.1rem;
            font-weight: 600;
        }

        input[type="range"] {
            width: min(420px, 82%);
            margin-top: 10px;
        }

        #status {
            margin: 10px 0 18px;
            color: var(--muted);
            font-weight: 600;
        }

        #vtk-container {
            width: min(840px, 92vw);
            height: min(760px, 80vh);
            margin: 0 auto 40px;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            overflow: hidden;
            background: #0b1220;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <h1>Simulation Dashboard</h1>

    <div class="control-panel">
        <label>
            throat_ratio: <span id="throat_ratioValue">0.3</span>
        </label>
        <br>
        <input
            type="range"
            id="throat_ratioSlider"
            min="0.2"
            max="0.4"
            step="0.025"
            value="0.3"
        >
    </div>

    <div id="status">Connecting to simulation...</div>

    <div id="vtk-container"></div>

    <script>
        const WS_URL = "ws://localhost:8000/graph-stream";
        const socket = new WebSocket(WS_URL);

        const status = document.getElementById("status");
        const slider = document.getElementById("throat_ratioSlider");
        const valueDisplay = document.getElementById("throat_ratioValue");

        const vtk = window.vtk;

        const vtkActor = vtk.Rendering.Core.vtkActor;
        const vtkMapper = vtk.Rendering.Core.vtkMapper;

        const vtkPolyData = vtk.Common.DataModel.vtkPolyData;
        const vtkPoints = vtk.Common.Core.vtkPoints;
        const vtkCellArray = vtk.Common.Core.vtkCellArray;
        const vtkDataArray = vtk.Common.Core.vtkDataArray;
        const vtkLookupTable = vtk.Common.Core.vtkLookupTable;

        const vtkSphereSource = vtk.Filters.Sources.vtkSphereSource;

        const vtkFullScreenRenderWindow = vtk.Rendering.Misc.vtkFullScreenRenderWindow;

        console.log("vtkPoints =", vtkPoints);
        console.log("vtkCellArray =", vtkCellArray);
        console.log("vtkDataArray =", vtkDataArray);

        const fullScreenRenderer = vtkFullScreenRenderWindow.newInstance({
            rootContainer: document.getElementById("vtk-container"),
            background: [0.06, 0.08, 0.12],
            containerStyle: {
                width: "100%",
                height: "100%"
            }
        });

        const renderer = fullScreenRenderer.getRenderer();
        const renderWindow = fullScreenRenderer.getRenderWindow();

        const mapper = vtkMapper.newInstance();
        const lookupTable = vtkLookupTable.newInstance();
        lookupTable.setRange(0.0, 2.0);
        lookupTable.setNumberOfColors(256);

        lookupTable.setHueRange(0.667, 0.0);   // blue -> red
        lookupTable.setSaturationRange(1.0, 1.0);
        lookupTable.setValueRange(1.0, 1.0);

        lookupTable.build();
        mapper.setLookupTable(lookupTable);

        const actor = vtkActor.newInstance();
        actor.setMapper(mapper);

        actor.getProperty().setColor(0.35, 0.75, 1.0);
        actor.getProperty().setOpacity(1.0);
        actor.getProperty().setRepresentationToSurface();

        renderer.addActor(actor);


        // ------------------------------------------------------------
        // Particle visualization
        // ------------------------------------------------------------

        const particleActors = [];

        function clearParticleActors() {
            for (const actor of particleActors) {
                renderer.removeActor(actor);
                actor.delete();
            }

            particleActors.length = 0;
        }


        function updateParticles(frame) {

            clearParticleActors();

            const positions = frame.particles?.positions ?? [];

            for (const position of positions) {

                const x = Number(position[0]);
                const y = Number(position[1]);
                const z = Number(position[2]);

                if (
                    !Number.isFinite(x) ||
                    !Number.isFinite(y) ||
                    !Number.isFinite(z)
                ) {
                    continue;
                }

                // Create a sphere for this particle
                const sphere = vtkSphereSource.newInstance({
                    radius: 0.02,
                    thetaResolution: 12,
                    phiResolution: 12,
                    center: [x, y, z]
                });

                const sphereMapper = vtkMapper.newInstance();
                sphereMapper.setInputConnection(
                    sphere.getOutputPort()
                );

                const sphereActor = vtkActor.newInstance();
                sphereActor.setMapper(sphereMapper);

                sphereActor.getProperty().setColor(0.0,0.4,0.5);

                sphereActor.getProperty().setOpacity(1.0);

                renderer.addActor(sphereActor);

                particleActors.push(sphereActor);
            }

        }

        renderer.getActiveCamera().setPosition(0, 0, 6);
        renderer.getActiveCamera().setFocalPoint(0, 0, 0);
        renderer.getActiveCamera().setViewUp(0, 1, 0);

        function buildNozzleMesh(frame) {
            const xGrid = frame.geometry.x;
            const yGrid = frame.geometry.y;
            const zGrid = frame.geometry.z;
            const magGrid = frame.velocity.magnitude;
            const partPos = frame.particles.positions;

            const rows = xGrid.length;
            const cols = xGrid[0].length;

            //console.log("Grid:", rows, cols);
            //console.log("x:", xGrid[0][0], xGrid[rows - 1][cols - 1]);
            //console.log("magnitude:", magGrid[0][0]);

            const points = [];
            const scalars = [];

            // Points
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    points.push(
                        Number(xGrid[i][j]),
                        Number(yGrid[i][j]),
                        Number(zGrid[i][j])
                    );

                    scalars.push(Number(magGrid[i][j]));
                }
            }

            // Quad connectivity
            const polys = vtkCellArray.newInstance();

            for (let i = 0; i < rows - 1; i++) {
                for (let j = 0; j < cols - 1; j++) {

                    const p0 = i * cols + j;
                    const p1 = p0 + 1;
                    const p2 = p0 + cols + 1;
                    const p3 = p0 + cols;

                    polys.insertNextCell([p0, p1, p2, p3]);
                }
            }

            const vtkPointsObject = vtkPoints.newInstance();

            vtkPointsObject.setData(
                Float32Array.from(points),
                3
            );

            const velocityArray = vtkDataArray.newInstance({
                name: "velocity",
                numberOfComponents: 1,
                values: Float32Array.from(scalars)
            });

            const polyData = vtkPolyData.newInstance();

            polyData.setPoints(vtkPointsObject);
            polyData.setPolys(polys);
            polyData.getPointData().setScalars(velocityArray);

            return polyData;
        }

        

        let cameraInitialized = false;
        function updateScene(frame) {

            // --------------------------------------------------------
            // Nozzle
            // --------------------------------------------------------

            const mesh = buildNozzleMesh(frame);

            if (mesh) {
                mapper.setInputData(mesh);
                mapper.setScalarVisibility(true);
                mapper.setColorByArrayName("velocity");
                mapper.setScalarModeToUsePointFieldData();
                mapper.setScalarRange(0.0, 2.0);
                mapper.setUseLookupTableScalarRange(true);
            }


            // --------------------------------------------------------
            // Particles
            // --------------------------------------------------------

            updateParticles(frame);

            // --------------------------------------------------------
            // Camera
            // --------------------------------------------------------

            if (!cameraInitialized) {
                renderer.resetCamera();
                cameraInitialized = true;
            }

            // --------------------------------------------------------
            // Render
            // --------------------------------------------------------

            renderWindow.render();
        }

        socket.onopen = function () {
            status.innerHTML = "Connected to simulation";
            status.style.color = "#34d399";
        };

        socket.onmessage = function (event) {
            const frame = JSON.parse(event.data);
            status.innerHTML = "Receiving simulation data";
            status.style.color = "#34d399";
            updateScene(frame);
        };

        socket.onerror = function (error) {
            console.error("WebSocket error:", error);
            status.innerHTML = "WebSocket error";
            status.style.color = "#f87171";
        };

        socket.onclose = function () {
            status.innerHTML = "Disconnected";
            status.style.color = "#fbbf24";
        };

        slider.addEventListener("input", function () {
            valueDisplay.textContent = this.value;
        });

        slider.addEventListener("change", function () {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "parameterUpdate",
                    throat_ratio: Number(slider.value)
                }));
            }
        });
    </script>
</body>
</html>
